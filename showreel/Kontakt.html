<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
  <style>

    * {
      box-sizing: border-box;
    }
    section {
      display: flex;
    }
    .topnav {
      overflow: hidden;
      background-color: beige;
    }

    .topnav a {
      float: left;
      display: block;
      color: black;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
      font-size: 17px;
    }

    .active {
      background-color: lightcoral;
      color: white;
    }

    .topnav .icon {
      display: none;
    }

    .dropdown-content a {
      float: none;
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      text-align: left;
    }

    .topnav a:hover, .dropdown:hover .dropbtn {
      background-color: burlywood ;
      color: black;
    }

    .dropdown-content a:hover {
      background-color: burlywood;
      color: black;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    @media screen and (max-width: 600px) {
      .topnav a:not(:first-child), .dropdown .dropbtn {
        display: none;
      }
      .topnav a.icon {
        float: right;
        display: block;
      }
    }

    @media screen and (max-width: 600px) {
      .topnav.responsive {position: relative;}
      .topnav.responsive .icon {
        position: absolute;
        right: 0;
        top: 0;
      }
      .topnav.responsive a {
        float: none;
        display: block;
        text-align: left;
      }
      .topnav.responsive .dropdown {float: none;}
      .topnav.responsive .dropdown-content {position: relative;}
      .topnav.responsive .dropdown .dropbtn {
        display: block;
        width: 100%;
        text-align: left;
      }
    }
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Lucida Sans", sans-serif;
      font-size: 17px;
    }
    .header {
      padding: 60px;
      text-align: center;
      grid-area: header;
      background-color: beige;
      color: black;
      outline-color:black;
      outline-style: solid;
    }

    .header > h1 {
      font-size: 40px;
    }
    .facts {
      grid-area: facts;
      border: 1px solid #0099cc;
      background-color: beige;
      padding: 10px;
      position: relative;
    }

    .facts > h2 {
      font-size: 20px;
    }

    .facts li {
      margin-bottom: 5px;
    }

    .footer {
      grid-area: footer;
      background-color: lightcoral;
      color: black;
      text-align: center;
    }
    a.one:link {color:black;}
    a.one:visited {color: beige;}
    a.one:hover {color:black;}
  </style>

</head>
<body>
<header>
  <div class="header"><h1>Kontakt Informationer</h1></div>

  <div class="topnav" id="myTopnav">
    <a href="index.html">Forside</a>

    <a href="Kontakt.html" class="active">Kontakt</a>
    <a href="Udvikling.html">Min Udvikling</a>
    <a href="projekter.html">Projektor</a>
    <a href="javascript:void(0);" style="font-size:15px;" class="icon" onclick="myFunction()">&#9776;</a>
  </div>

  <script>
    function myFunction() {
      var x = document.getElementById("myTopnav");
      if (x.className === "topnav") {
        x.className += " responsive";
      } else {
        x.className = "topnav";
      }
    }
  </script>
</header>

</html>
